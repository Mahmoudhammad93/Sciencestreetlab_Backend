<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><title>Physics Force Simulation</title><link rel="stylesheet" href="css/game.css"/></head>
<body>
  <h1>Physics Force Simulation</h1>
  <p class="muted">Change mass and force (F=ma), observe acceleration, then answer challenges.</p>
  <div class="card">
    <div id="canvas"><div id="ball"></div></div>
    <label>Mass (kg): <input id="mass" type="range" min="1" max="10" value="2" step="0.5"></label>
    <label>Force (N): <input id="force" type="range" min="1" max="40" value="10" step="1"></label>
    <p>Acceleration: <strong id="accel">-</strong></p>
  </div>
  <div class="card">
    <label>What is current acceleration? <input id="guess" type="number" step="0.01"></label>
    <label>If force doubles, new acceleration? <input id="guess2" type="number" step="0.01"></label>
    <button id="start">Start</button>
    <button id="ask">Submit answers</button>
    <button id="retry">Retry</button>
  </div>
  <div id="status">Click Start.</div>
  <script src="js/game.js"></script>
</body></html>
