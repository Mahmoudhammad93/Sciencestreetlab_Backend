services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: science-street-backend

    env_file:
      - .env

    restart: unless-stopped

    expose:
      - "9000"

    volumes:
      - storage:/var/www/storage

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - app


  mysql:
    image: mysql:8.0

    container_name: science-street-mysql

    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}

    volumes:
      - mysql_data:/var/lib/mysql

    ports:
      - "127.0.0.1:3306:3306"

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${DB_ROOT_PASSWORD}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - app


  queue:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: science-street-queue

    env_file:
      - .env

    restart: unless-stopped

    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90

    volumes:
      - storage:/var/www/storage

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - app


  scheduler:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: science-street-scheduler

    env_file:
      - .env

    restart: unless-stopped

    command: php artisan schedule:work

    volumes:
      - storage:/var/www/storage

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - app
  nginx:
    image: nginx:alpine

    container_name: science-street-nginx

    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - ./:/var/www:ro
      - storage:/var/www/storage:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - backend

    networks:
      - app

volumes:
  mysql_data:
  storage:


networks:
  app: