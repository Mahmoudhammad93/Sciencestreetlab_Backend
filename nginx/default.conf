server {
    listen 80;
    server_name _;

    client_max_body_size 100M;

    # Laravel Admin (Filament)
    location ^~ /admin {
        root /var/www/public;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Laravel API
    location ^~ /api {
        root /var/www/public;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Sandboxed interactive HTML packages (signed routes)
    location ^~ /interactive-activities {
        root /var/www/public;
        try_files $uri /index.php?$query_string;
    }

    location ^~ /interactive/ {
        root /var/www/public;
        try_files $uri /index.php?$query_string;
    }

    # Vite build assets
    location ^~ /build/ {
        root /var/www/public;
        try_files $uri =404;
        access_log off;
        expires 7d;
    }

    # Filament published CSS/JS
    location ^~ /css/ {
        root /var/www/public;
        try_files $uri =404;
        access_log off;
        expires 7d;
    }

    location ^~ /js/ {
        root /var/www/public;
        try_files $uri =404;
        access_log off;
        expires 7d;
    }

    location ^~ /fonts/ {
        root /var/www/public;
        try_files $uri =404;
        access_log off;
        expires 30d;
    }

    # Livewire (Filament)
    location ^~ /livewire {
        root /var/www/public;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Uploaded / public storage
    location ^~ /storage/ {
        alias /var/www/storage/app/public/;
        access_log off;
        expires 7d;
    }

    # Frontend (React)
    location / {
        proxy_pass http://science-street-frontend:4173;
        proxy_set_header Host localhost;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Laravel PHP
    location ~ \.php$ {
        root /var/www/public;

        try_files $uri =404;

        fastcgi_pass backend:9000;
        fastcgi_index index.php;

        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_param HTTPS off;
        fastcgi_param HTTP_HOST $host;
        fastcgi_param SERVER_NAME $host;
    }

    location ~ /\.ht {
        deny all;
    }
}
