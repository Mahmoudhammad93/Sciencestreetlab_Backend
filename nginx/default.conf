# Canonical public host: sciencestreetlab.com
# Legacy app. subdomain permanently redirects to apex (path + query preserved).

# HTTP -> HTTPS (apex)
server {
    listen 80;
    server_name sciencestreetlab.com www.sciencestreetlab.com;

    return 301 https://sciencestreetlab.com$request_uri;
}

# HTTP -> HTTPS (legacy app subdomain -> apex)
server {
    listen 80;
    server_name app.sciencestreetlab.com;

    return 301 https://sciencestreetlab.com$request_uri;
}

# Legacy app subdomain on HTTPS -> canonical apex (preserve path/query)
server {
    listen 443 ssl;
    server_name app.sciencestreetlab.com;

    ssl_certificate /etc/nginx/ssl/sciencestreetlab/origin.crt;
    ssl_certificate_key /etc/nginx/ssl/sciencestreetlab/origin.key;

    return 301 https://sciencestreetlab.com$request_uri;
}

# www -> apex
server {
    listen 443 ssl;
    server_name www.sciencestreetlab.com;

    ssl_certificate /etc/nginx/ssl/sciencestreetlab/origin.crt;
    ssl_certificate_key /etc/nginx/ssl/sciencestreetlab/origin.key;

    return 301 https://sciencestreetlab.com$request_uri;
}

# HTTPS apex
server {
    listen 443 ssl;
    server_name sciencestreetlab.com;

    ssl_certificate /etc/nginx/ssl/sciencestreetlab/origin.crt;
    ssl_certificate_key /etc/nginx/ssl/sciencestreetlab/origin.key;

    client_max_body_size 100M;

    # Docker embedded DNS — re-resolve upstreams when backend/frontend containers are recreated
    # (plain "fastcgi_pass backend:9000" is resolved once at startup and goes stale).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Legacy WordPress routes must never serve/activate accounts.
    location = /wp-signup.php {
        return 301 /login;
    }

    location = /wp-login.php {
        return 301 /login;
    }

    location ^~ /wp-admin {
        return 301 /admin;
    }

    # Laravel Admin (Filament)
    location ^~ /admin {
        root /var/www/public;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Laravel API
    location ^~ /api {
        root /var/www/public;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Sandboxed interactive HTML packages (signed routes)
    location ^~ /interactive-activities {
        root /var/www/public;
        try_files $uri /index.php?$query_string;
    }

    location ^~ /interactive/ {
        root /var/www/public;
        try_files $uri /index.php?$query_string;
    }

    # Vite build assets
    location ^~ /build/ {
        root /var/www/public;
        try_files $uri =404;
        access_log off;
        expires 7d;
    }

    # Filament published CSS/JS
    location ^~ /css/ {
        root /var/www/public;
        try_files $uri =404;
        access_log off;
        expires 7d;
    }

    location ^~ /js/ {
        root /var/www/public;
        try_files $uri =404;
        access_log off;
        expires 7d;
    }

    location ^~ /fonts/ {
        root /var/www/public;
        try_files $uri =404;
        access_log off;
        expires 30d;
    }

    # Livewire (Filament) — large interactive HTML/ZIP uploads
    location ^~ /livewire {
        root /var/www/public;
        client_max_body_size 100M;
        client_body_timeout 180s;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Social Attribution tracking redirects (Laravel) — must precede SPA proxy
    location ^~ /go/ {
        root /var/www/public;
        try_files $uri /index.php?$query_string;
        add_header Cache-Control "no-store, private" always;
    }

    # Uploaded / public storage
    location ^~ /storage/ {
        alias /var/www/storage/app/public/;
        access_log off;
        expires 7d;
    }

    # Frontend (React SPA — client routes fall through spa-server)
    location / {
        set $frontend_upstream science-street-frontend:4173;
        proxy_pass http://$frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Laravel PHP
    location ~ \.php$ {
        root /var/www/public;

        try_files $uri =404;

        set $php_upstream backend:9000;
        fastcgi_pass $php_upstream;
        fastcgi_index index.php;
        fastcgi_pass_header Set-Cookie;
        fastcgi_pass_request_headers on;

        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;

        # Request arrived at Nginx through HTTPS
        fastcgi_param HTTPS on;

        fastcgi_param HTTP_HOST $host;
        fastcgi_param SERVER_NAME $host;
    }

    location ~ /\.ht {
        deny all;
    }
}
