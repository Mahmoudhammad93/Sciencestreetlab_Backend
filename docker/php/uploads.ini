; Interactive HTML packages and admin image uploads.
; Keep post_max_size above upload_max_filesize so multipart uploads are not
; silently emptied (which makes Livewire receive HTML/empty bodies → JSON.parse).
upload_max_filesize = 64M
post_max_size = 96M
memory_limit = 512M
max_execution_time = 180
max_input_time = 180
